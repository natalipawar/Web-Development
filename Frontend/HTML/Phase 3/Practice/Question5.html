<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form action="/action">
            <div>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="msg"
                    placeholder="enter your name"
                />
            </div>
            <div>
                <label for="sex">Sex: </label>

                <input type="radio" id="male" name="msg" value="male" />
                <label for="male">Male</label>

                <input type="radio" id="female" name="msg" value="female" />
                <label for="female">Female</label>
            </div>
            <div>
                <label for="place">Country:</label>
                <select id="place" name="msg">
                    <option>Select an option</option>
                    <option value="India">India</option>
                    <option value="Nepal">Nepal</option>
                    <option value="USA">USA</option>
                    <option value="Canada">Canada</option>
                </select>
            </div>
            <div>
                <label for="message">Message:</label>
                <br />
                <textarea id="message" rows="10" cols="30"></textarea>
            </div>
            <div>
                <input type="checkbox" id="check" name="reg" />
                <label for="check">Subscribe?</label>
            </div>
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
