<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lists in HTML</title>
    </head>
    <body>
        <h3>Want to buy:</h3>
        <!-- Unordered List -->
        <ul>
            <li>Bread</li>
            <li>Jam</li>
            <li>Frooti</li>
            <li>Chips</li>
        </ul>
        <!-- Ordered List -->
        <ol>
            <li>Bread</li>
            <li>Jam</li>
            <li>Frooti</li>
            <li>Chips</li>
        </ol>
        <!-- Changing types in Ordered List -->
        <ol type="A">
            <li>Bread</li>
            <li>Jam</li>
            <li>Frooti</li>
            <li>Chips</li>
        </ol>
        <ol type="a">
            <li>Bread</li>
            <li>Jam</li>
            <li>Frooti</li>
            <li>Chips</li>
        </ol>

        <!-- Nested Lists-->
        <ul>
            <li>
                Bread
                <ol>
                    <li>Brown Bread</li>
                    <li>Sandwich Bread</li>
                </ol>
            </li>
        </ul>
    </body>
</html>
