<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Image Tags in HTML</title>
    </head>
    <body>
        <!-- Relative URL-->
        <img src="Camera.jpg" alt="Camera pic" />
        <img src="Camera.jpg" alt="Camera pic" height="100px" width="100px" />
        <img src="Cameraaa.jpg" alt="Camera pic" />

        <!-- Absolute URL-->
        <img
            src="https://static.vecteezy.com/system/resources/thumbnails/057/068/323/small/single-fresh-red-strawberry-on-table-green-background-food-fruit-sweet-macro-juicy-plant-image-photo.jpg"
            alt="Strawberry image"
        />
    </body>
</html>
